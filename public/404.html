<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Não Encontrada • Vírtuose Art Decor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#E8E0D3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #f7f4ed;
        color: #1c241b;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 580px;
        background: #E8E0D3;
        border: 1px solid rgba(158, 168, 139, 0.4);
        padding: 48px 32px;
        border-radius: 4px;
        box-shadow: 0 20px 40px rgba(28, 36, 27, 0.08);
      }
      .crest {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border: 2px solid #9EA88B;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cormorant Garamond', serif;
        font-size: 28px;
        font-style: italic;
        background: #f7f4ed;
      }
      .tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: #9EA88B;
        font-weight: 700;
        margin-bottom: 12px;
        display: block;
      }
      h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 38px;
        font-weight: 300;
        line-height: 1.15;
        margin-bottom: 16px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #4f584a;
        margin-bottom: 28px;
        font-weight: 300;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn-primary {
        background: #9EA88B;
        color: #1c241b;
        padding: 14px 28px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 600;
        text-decoration: none;
        border-radius: 2px;
        transition: opacity 0.3s;
      }
      .btn-primary:hover { opacity: 0.9; }
      .btn-secondary {
        background: transparent;
        color: #1c241b;
        border: 1px solid rgba(28, 36, 27, 0.2);
        padding: 14px 24px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 600;
        text-decoration: none;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="crest">V</div>
      <span class="tag">Página Não Encontrada • 404</span>
      <h1>A beleza permanece, mas este caminho se desfez.</h1>
      <p>O endereço solicitado não existe ou mudou de lugar. Convidamos você a retornar à nossa página principal ou explorar as coleções autorais.</p>
      <div class="actions">
        <a href="/" class="btn-primary">Voltar ao Início</a>
        <a href="/colecoes" class="btn-secondary">Ver Coleções</a>
      </div>
    </div>
  </body>
</html>
